{
    "opts": {
        "template": "tools/templates/docdash/",
        "encoding": "utf8",
        "destination": "./doc/",
        "recurse": true
    },
    "plugins": [
        "plugins/markdown"
    ],
    "tags": {
        "allowUnknownTags": false
    },
    "source": {
        "include": [
            "./scripts",
            "./src",
            "./text-to-svg"
        ]
    },
    "docdash": {
        "static": true,
        "sort": true,
        "search": true,
        "collapse": true,
        "typedefs": true,
        "removeQuotes": "none",
        "scripts": [],
        "menu": {
            "Github repo": {
                "href": "https://github.com/copious-world/calendar-owner",
                "target": "_blank",
                "class": "menu-item",
                "id": "repository"
            },
            "Npm package": {
                "href": "https://www.npmjs.com/package/calendar-owner",
                "target": "_blank",
                "class": "menu-item",
                "id": "package"
            }
        }
    },
    "templates": {
        "default": {
            "useLongnameInNav": true
        }
    }
}